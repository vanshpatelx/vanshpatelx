  <text x="64" y="194" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#8B949E">Backend &amp; infrastructure engineer</text>
  <text x="64" y="232" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6E7681">Go · TypeScript · Python · Swift — services, pipelines, and the infra under them</text>

  <g stroke="#30363D" stroke-width="1.5">
